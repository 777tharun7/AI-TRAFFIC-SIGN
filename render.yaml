services:
  # RoadSense AI FastAPI Backend Service
  - type: web
    name: roadsense-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "False"
      - key: PRIMARY_CITY
        value: HYDERABAD

  # RoadSense AI React + Vite Frontend
  - type: static_site
    name: roadsense-frontend
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
