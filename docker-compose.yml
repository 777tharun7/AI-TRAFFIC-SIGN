version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: roadsense-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=True
      - PRIMARY_CITY=HYDERABAD
      - DATABASE_URL=sqlite:///./roadsense.db
    volumes:
      - ./models:/app/models
      - ./datasets:/app/datasets
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: roadsense-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
